[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-modal-response-solver"
version = "1.0.0"
description = "Qt-free batch runtime for the MARS modal analysis response solver"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ansys-dpf-core>=0.16,<0.17",
    "numba>=0.65.1",
    "numpy>=2.0",
    "pandas>=2.3",
    "psutil>=5.9",
]

[project.scripts]
MARSBatch = "mars_solver.headless_runtime:cli_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mars_solver*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
